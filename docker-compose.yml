services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: ${MONGODB_URI:?Add MONGODB_URI to the .env file}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://localhost:8080}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Add JWT_ACCESS_SECRET to .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Add JWT_REFRESH_SECRET to .env}
    ports:
      - "3000:3000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped