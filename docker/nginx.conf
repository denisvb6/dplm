server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;

    location /api/ {
        resolver 8.8.8.8 1.1.1.1 valid=30s;
        set $backend "https://diplom-backend-nk11.onrender.com";
        proxy_pass $backend/api/;
        proxy_pass https://diplom-backend-nk11.onrender.com/api/;
        proxy_http_version 1.1;
        proxy_set_header Host diplom-backend-nk11.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;

        proxy_ssl_server_name on;                              
        proxy_ssl_name "diplom-backend-nk11.onrender.com";
    }

    location = /health {
        resolver 8.8.8.8 1.1.1.1 valid=30s;
        set $backend "https://diplom-backend-nk11.onrender.com";
        proxy_pass $backend/api/;
        proxy_pass https://diplom-backend-nk11.onrender.com/health;
        proxy_http_version 1.1;
        proxy_set_header Host diplom-backend-nk11.onrender.com;
        proxy_ssl_server_name on;
        proxy_ssl_name "diplom-backend-nk11.onrender.com";
}

    location / {
        try_files $uri $uri/ /index.html;
    }
}
